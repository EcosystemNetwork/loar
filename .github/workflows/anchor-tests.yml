name: Anchor tests

# Runs the Solana program test suite on every PR that touches the Anchor
# workspace. Spins up solana-test-validator inside the runner, deploys the
# programs, runs the universe + episode + payment + smoke test suites.
#
# Gated to paths that affect the programs so unrelated PRs don't pay the
# ~5-minute warm-up cost of building Anchor + Solana CLI.

on:
  push:
    branches: [main]
    paths:
      - 'apps/programs/**'
      - '.github/workflows/anchor-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/programs/**'
      - '.github/workflows/anchor-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Test-only workflow — no write access to the repo needed.
permissions:
  contents: read

jobs:
  anchor-test:
    name: anchor test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install repo dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Rust toolchain + cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/programs

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
        env:
          CARGO_TERM_COLOR: always

      - name: Pin Anchor version
        working-directory: apps/programs
        run: |
          avm install 0.31.1
          avm use 0.31.1
          anchor --version

      - name: Generate program keypairs + sync declare_id!
        working-directory: apps/programs
        run: |
          # The real deploy keypairs are never committed (target/ is gitignored)
          # — they are the program upgrade authority and live offline. For CI we
          # mint throwaway keypairs for every workspace member, then `anchor keys
          # sync` rewrites each declare_id!() + the [programs.*] tables to match.
          # This edits the working tree inside the runner only; it is never
          # committed. The canonical devnet IDs stay intact in git.
          mkdir -p target/deploy
          progs="universe episode payment rights licensing split_router staking \
                 credit_manager subscription remix_fees bonding_curve canon_market \
                 fee_locker premium_actions collab_manager"
          for prog in $progs; do
            kp="target/deploy/${prog}-keypair.json"
            [ -f "$kp" ] || solana-keygen new --no-bip39-passphrase --silent --outfile "$kp"
          done
          anchor keys sync
          git diff --stat  # visibility only — not committed

      - name: Start funded local validator
        working-directory: apps/programs
        run: |
          # Deploying 15 programs peaks well above the default provider-wallet
          # balance anchor's own validator provides. Start our own with the
          # deployer as --mint (seeds it with 500M SOL) and point anchor at it.
          DEPLOYER="$(solana address)"
          solana-test-validator --reset --quiet \
            --ledger .anchor/test-ledger \
            --mint "$DEPLOYER" \
            --bind-address 0.0.0.0 --rpc-port 8899 &
          echo "VALIDATOR_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            solana cluster-version --url http://127.0.0.1:8899 >/dev/null 2>&1 && break
            sleep 2
          done
          solana config set --url http://127.0.0.1:8899
          solana balance

      - name: Anchor test
        working-directory: apps/programs
        run: anchor test --skip-lint --skip-local-validator

      - name: Stop local validator
        if: always()
        run: kill "${VALIDATOR_PID}" 2>/dev/null || true
