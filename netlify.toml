# Netlify config for the LOAR web app (apps/web), which serves loar.fun.
#
# DELIBERATELY NO [build] BLOCK. netlify.toml overrides the dashboard's build
# settings, and the dashboard config currently builds and deploys correctly —
# codifying a second source of truth here risks breaking a working deploy for
# no gain. Everything below is purely additive: it fixes things that are
# missing today and cannot affect whether the build succeeds.
#
# If you later want the build in version control, confirm the dashboard's
# command/publish/base first, then add them here to match exactly.

# ── SPA fallback ─────────────────────────────────────────────────────
# Without this every deep link 404s: /gallery, /create, /universe/:id all
# return Netlify's 404 page on direct navigation, refresh, or a shared link,
# because no file exists at those paths. Netlify matches real static files
# before applying a 200 rewrite, so /assets needs no exclusion (the old
# vercel.json config needed a regex carve-out for the same effect).
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ─────────────────────────────────────────────────
# Live responses currently carry only Strict-Transport-Security. These mirror
# nginx.conf so the Netlify-served frontend matches the rest of the stack.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    # Mirrors the meta tag in apps/web/index.html. Sent as a real header here —
    # a meta http-equiv Permissions-Policy is ignored by most engines.
    Permissions-Policy        = "local-network=(), loopback-network=()"
    # Content-Security-Policy — F5. index.html ships an equivalent <meta> CSP,
    # but a meta policy is applied late (misses resources referenced before the
    # tag), cannot express frame-ancestors, and cannot be Report-Only. This is
    # the authoritative header version. It mirrors the meta allowlists but drops
    # the http://localhost / ws://localhost dev origins (dead on loar.fun) and
    # adds object-src 'none', frame-ancestors 'none', form-action 'self'.
    # Keep this in sync with apps/web/index.html when either changes.
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://js.stripe.com https://www.googletagmanager.com https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.loar.fun https://*.alchemy.com https://*.publicnode.com https://*.googleapis.com https://*.firebaseio.com https://*.up.railway.app https://*.thirdweb.com https://*.walletconnect.com https://*.walletconnect.org https://pulse.walletconnect.org https://api.web3modal.org https://rpc.sepolia.org https://sepolia.base.org https://mainnet.base.org https://base.drpc.org https://gateway.tenderly.co https://api.unstoppabledomains.com https://*.fal.ai https://*.fal.media https://*.pinata.cloud https://gateway.pinata.cloud https://*.lighthouse.storage https://*.meshy.ai https://w3s.link https://*.w3s.link https://ipfs.io https://dweb.link https://*.dweb.link https://www.google-analytics.com https://*.analytics.google.com https://*.google-analytics.com https://www.googletagmanager.com https://accounts.google.com https://api.coingecko.com wss://*.walletconnect.com wss://*.walletconnect.org wss://*.thirdweb.com; media-src 'self' blob: https://storage.googleapis.com https://generativelanguage.googleapis.com https://*.firebasestorage.app https://*.pinata.cloud https://gateway.pinata.cloud https://*.mypinata.cloud https://*.lighthouse.storage https://*.volces.com https://*.fal.ai https://*.fal.media https://w3s.link https://*.w3s.link https://ipfs.io https://dweb.link https://*.dweb.link; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://connect-embedded.thirdweb.com https://verify.walletconnect.com https://verify.walletconnect.org https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# ── Caching ──────────────────────────────────────────────────────────
# Vite emits content-hashed filenames under /assets, so they are immutable.
# They are currently served max-age=0, must-revalidate, which re-fetches the
# whole ~12MB bundle set on every visit.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must never be cached or clients pin to a stale build forever.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
